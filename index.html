<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大家來找碴產生器</title>
<style>
:root{--bg:#f3f1ee;--bar:#fff;--ink:#1b1b1b;--line:#1b1b1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#222;--bar:#2e2e2e;--ink:#eee;--line:#eee}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 16px;background:var(--bar);border-bottom:2px solid var(--line)}
.bar label{font-size:14px;display:flex;gap:6px;align-items:center}
.bar input[type=number]{width:52px}
.bar input[type=text]{width:90px}
button{font:inherit;font-size:14px;padding:7px 14px;border:2px solid var(--line);background:var(--bar);color:var(--ink);border-radius:999px;cursor:pointer}
button.main{background:var(--ink);color:var(--bar)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #888;outline-offset:2px}
fieldset{border:2px solid var(--line);border-radius:12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 10px;margin:0}legend{font-size:13px;font-weight:700;padding:0 6px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 16px 0;font-size:14px}.fb{display:inline-flex;gap:6px;align-items:center;padding:5px 12px}.fb i{width:12px;height:12px;border-radius:50%;display:inline-block}.fb.on{background:var(--ink);color:var(--bar)}
.note{font-size:12.5px;opacity:.75;padding:8px 16px}
.paper{padding:16px;overflow-x:auto}
#stage svg{display:block;width:100%;max-width:1400px;height:auto;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25)}
@media print{.bar,.note,.fbar{display:none}.paper{padding:0}#stage svg{max-width:none;box-shadow:none}@page{size:A4 landscape;margin:0}}
</style>
</head>
<body>
<div class="bar">
  <label>標題 <input id="ttl" type="text" value="大家來找碴！☆ 角落生物篇 ☆" style="width:240px"></label><fieldset><legend>主角①</legend><label>名稱 <input id="nm" type="text" value="" placeholder="可留空"></label>
  <label>角色圖片 <input id="up" type="file" accept="image/*"></label>
  <button id="reset" type="button">預設圖</button>
  <label>低 <input id="n1" type="number" min="0" max="30" value="7"></label>
  <label>中 <input id="n2" type="number" min="0" max="30" value="10"></label>
  <label>高 <input id="n3" type="number" min="0" max="40" value="15"></label></fieldset>
  <fieldset><legend>角色②（數量 0＝不出現）</legend><label>名稱 <input id="nm2" type="text" value="" placeholder="可留空"></label><label>圖片 <input id="up2" type="file" accept="image/*"></label><button id="reset2" type="button">預設圖</button><label>低 <input id="a1" type="number" min="0" max="30" value="0"></label><label>中 <input id="a2" type="number" min="0" max="30" value="0"></label><label>高 <input id="a3" type="number" min="0" max="40" value="0"></label></fieldset>

  <label>尺寸 <select id="ratio"><option value="a4">A4 橫式</option><option value="169">16:9</option></select></label>
  <label><input id="ans" type="checkbox"> 顯示解答</label>
  <button id="go" class="main" type="button">重新產生</button>
  <button id="dl" type="button">下載 PNG</button>
  <button id="pr" type="button">列印</button>
</div>
<div class="note">上傳角色圖後會自動轉成黑白線稿；每次按「重新產生」都是新的版面。勾選「顯示解答」可看到每隻角色的位置與編號；也可以直接點圖片下方的角色名稱，單獨顯示那個角色的答案（再點一次關閉）。</div>
<div class="fbar" id="fbar"></div>
<div class="paper"><div id="stage"></div></div>
